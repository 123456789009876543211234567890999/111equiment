<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>建立帳號｜設備借用系統</title>
    <script src="auth.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; padding: 20px; background: #f8f9fa; color: #222; }
        .box { max-width: 360px; margin: 24px auto 0; padding: 24px 20px; background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
        h2 { text-align: center; margin: 0 0 20px; }
        label { display: block; margin-bottom: 14px; font-size: 15px; color: #555; }
        .field { margin-bottom: 14px; }
        .field label { margin-bottom: 0; }
        input { display: block; width: 100%; margin-top: 6px; padding: 10px; font-size: 18px; border: 1px solid #ccc; border-radius: 6px; }
        small { display: block; margin-top: 4px; font-size: 12px; color: #888; }
        button { width: 100%; padding: 12px; font-size: 18px; font-weight: bold; border: none; border-radius: 8px; background: #198754; color: #fff; cursor: pointer; }
        button:disabled { background: #9fcfb5; }
        #msg { min-height: 24px; margin-top: 14px; text-align: center; font-weight: bold; color: #dc3545; white-space: pre-wrap; }
        .captcha-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        #captcha-img { width: 160px; height: 60px; border: 1px solid #ccc; border-radius: 6px; background: #f1f3f5; }
        #captcha-refresh { width: auto; padding: 8px 12px; font-size: 14px; font-weight: normal; background: #6c757d; }
        .hint { margin-top: 14px; font-size: 13px; color: #888; text-align: center; }
        .hint a { color: #0d6efd; font-size: 15px; }
        #done { display: none; text-align: center; }
        #done p { white-space: pre-wrap; font-size: 17px; font-weight: bold; color: #198754; line-height: 1.6; }
        #done a { display: inline-block; margin-top: 8px; padding: 10px 24px; border-radius: 8px; background: #0d6efd; color: #fff; text-decoration: none; font-size: 17px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📝 建立帳號</h2>

        <form id="register-form" autocomplete="off">
            <label>帳號
                <input id="user" name="username" type="text" autocomplete="username" minlength="4" maxlength="20" pattern="[A-Za-z0-9]{4,20}" required autofocus>
                <small>4 到 20 個英文字母或數字，之後用它登入</small>
            </label>
            <label>姓名
                <input id="name" name="name" type="text" autocomplete="name" maxlength="20" required>
                <small>會顯示在畫面上並寫入借還紀錄</small>
            </label>
            <label>密碼
                <input id="password" name="password" type="password" autocomplete="new-password" minlength="4" maxlength="50" required>
                <small>至少 4 個字元</small>
            </label>
            <label>再輸入一次密碼
                <input id="password2" name="password2" type="password" autocomplete="new-password" minlength="4" maxlength="50" required>
            </label>
            <div class="field">
                <label for="captcha">驗證碼（請輸入圖片中的 4 個數字）</label>
                <div class="captcha-row">
                    <img id="captcha-img" alt="驗證碼圖片">
                    <button id="captcha-refresh" type="button">🔄 換一張</button>
                </div>
                <input id="captcha" name="captcha" type="text" inputmode="numeric" maxlength="4" autocomplete="off" required>
            </div>
            <button id="submit-btn" type="submit">建立帳號</button>
            <div id="msg"></div>
            <div class="hint">已經有帳號了？<a href="login.html">回登入頁</a></div>
        </form>

        <!-- 建立成功後顯示 -->
        <div id="done">
            <p id="done-text"></p>
            <a href="login.html">回登入頁</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('register-form');
        const btn = document.getElementById('submit-btn');
        const msg = document.getElementById('msg');
        const captchaInput = document.getElementById('captcha');
        const showError = text => { msg.style.color = "#dc3545"; msg.innerText = text; };
        const captchaBox = createCaptchaBox(
            document.getElementById('captcha-img'), captchaInput, document.getElementById('captcha-refresh'), showError);
        captchaBox.reload();

        form.addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const user = document.getElementById('user').value.trim();
            const name = document.getElementById('name').value.trim();
            const password = document.getElementById('password').value;

            // 先在瀏覽器檢查，省得白白用掉一張驗證碼；後台仍會再檢查一次
            if (!/^[A-Za-z0-9]{4,20}$/.test(user)) { showError("帳號須為 4 到 20 個英文字母或數字"); return; }
            if (!name) { showError("請輸入姓名"); return; }
            if (password.length < 4) { showError("密碼至少要 4 個字元"); return; }
            if (password !== document.getElementById('password2').value) { showError("兩次輸入的密碼不一樣"); return; }

            btn.disabled = true;
            msg.style.color = "#0056b3";
            msg.innerText = "建立中...";
            try {
                const data = await api({
                    action: "register",
                    user: user,
                    name: name,
                    password: password,
                    captchaId: captchaBox.id,
                    captcha: captchaInput.value.trim()
                }, false);
                if (data.ok) {
                    if (!data.pending) {            // 不需要審核：直接回登入頁
                        location.replace("login.html?registered=1");
                        return;
                    }
                    form.style.display = "none";
                    document.getElementById('done-text').innerText = data.message || "帳號已建立";
                    document.getElementById('done').style.display = "block";
                    return;
                }
                // 每張驗證碼只能用一次，失敗後要換一張
                await captchaBox.reload();
                showError(data.message || "建立失敗");
                if (data.code === "bad_captcha") captchaInput.focus();
            } catch (err) {
                console.error(err);
                showError("系統連線錯誤，請稍後再試。");
            }
            btn.disabled = false;
        });
    </script>
</body>
</html>
